# =============================================================================
# FAPOMS — Docker Compose (Development with Hot Reload)
# =============================================================================
#
# Usage:
#   docker compose --env-file .env.docker up -d      # Start in background
#   docker compose --env-file .env.docker up --build # Build & start
#   docker compose logs -f backend                   # Follow logs for a service
#   docker compose down                              # Stop all services
#   docker compose down -v                           # Stop & remove volumes (reset DB)
#
# `--env-file .env.docker` is what deploy/auto-deploy.sh already passes in production, so dev and
# prod are configured the same way. It matters because compose resolves `${VAR}` from the shell
# or --env-file — NOT from a service's own `env_file:` entry. Every `${VAR}` below carries the
# previous hardcoded value as its default, so plain `docker compose up` still works unchanged;
# passing the file is what makes .env.docker authoritative for the credentials too.
#
# Hot Reload:
#   Source directories are bind-mounted into containers.
#   Edit any file on your host → the container picks up changes instantly.
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: fapoms-postgres
    restart: unless-stopped
    # From .env.docker (the one env file) when it is passed with --env-file; the defaults are the
    # dev values this block used to hardcode, so nothing changes without it. These must agree with
    # DB_USERNAME/DB_PASSWORD/DB_DATABASE in that file — they are the credentials the role is
    # CREATED with here and the ones the backend then signs in with.
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fapoms}
      POSTGRES_USER: ${DB_USERNAME:-fapoms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fapoms_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ─────────────────────────────────────────────────────────────────────────
    # Query statistics. `-c` flags, not a mounted postgresql.conf — the same
    # mechanism deploy/docker-compose.prod.yml already uses, so there is one way
    # to configure Postgres in this repo rather than two.
    #
    # Deliberately NOT a copy of the production tuning block. Those values
    # (shared_buffers, work_mem, the WAL and autovacuum knobs) are sized against
    # that file's `mem_limit: 3g`; this stack has no memory limit at all and runs
    # beside Metro, Vite and a Nest watcher on a developer laptop. Duplicating
    # them here would be two sets of numbers claiming to describe one database.
    # What IS duplicated is the part that changes what can be *observed*, because
    # a developer measuring a query on a Postgres that keeps no statement history
    # is measuring a different database from the one that runs in production.
    #
    # RESTART REQUIRED: shared_preload_libraries is PGC_POSTMASTER — it can only
    # be read at postmaster startup, so `SELECT pg_reload_conf()` and `ALTER
    # SYSTEM` do nothing for it. Changing this line means recreating the
    # container (`docker compose up -d --force-recreate --no-deps postgres`);
    # the data lives in the `pgdata` named volume and survives that.
    #
    # Preloading is necessary but not sufficient: the extension itself is created
    # by migration 1790700000000-EnableQueryStatistics, which runs on connect.
    # Verified on PG 16.4 that the ORDER matters less than it looks — CREATE
    # EXTENSION succeeds with no library loaded; it is reading the view that
    # fails with 55000 until the postmaster has been restarted with this flag.
    # ─────────────────────────────────────────────────────────────────────────
    command:
      - postgres
      - -c
      - shared_preload_libraries=${PG_PRELOAD_LIBRARIES:-pg_stat_statements}
      # 5,000 normalised statements retained. Once full, pg_stat_statements evicts
      # the least-executed entries — which silently turns "the top queries" into
      # "the top queries that survived eviction". `db_query_stats_tracked` in
      # RuntimeMetricsService reports the occupancy so that is visible rather than
      # assumed; raise this if it sits near the ceiling.
      - -c
      - pg_stat_statements.max=${PG_STAT_STATEMENTS_MAX:-5000}
      # `top` records statements as the client issued them. `all` additionally
      # records statements executed inside functions and procedures, which
      # double-counts their time against the caller and roughly triples the number
      # of entries — not worth it while nothing in this schema is a stored
      # procedure hot path.
      - -c
      - pg_stat_statements.track=${PG_STAT_STATEMENTS_TRACK:-top}
      # Without this, blk_read_time/blk_write_time stay 0 and every "is this query
      # slow because of I/O or because of CPU?" question is unanswerable from the
      # statement history. The cost is a clock read per block access; measure with
      # `pg_test_timing` before enabling on a virtualised host with a slow clock
      # source, but on a laptop this is free.
      - -c
      - track_io_timing=${PG_TRACK_IO_TIMING:-on}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fapoms -d fapoms"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: fapoms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage for all binary files
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: fapoms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    # Same rule as postgres: these create the MinIO root credentials, and AWS_ACCESS_KEY_ID /
    # AWS_SECRET_ACCESS_KEY in .env.docker are what the backend presents to sign in with them.
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fapoms_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fapoms_minio_secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI (http://localhost:9001)
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # LiveKit — self-hosted WebRTC SFU for assayer ↔ data-entry voice calls
  #
  # Dev configuration, deliberately simple:
  #   - `devkey: secret` is the API keypair the backend signs access tokens with
  #     (LIVEKIT_API_KEY/SECRET in .env.docker). Rotate BOTH for any real deploy.
  #   - ICE over TCP (7881) is enabled so calls connect even where the UDP range
  #     isn't reachable (emulators, strict NATs); UDP 50100-50200 is the media
  #     range when it is. use_external_ip stays off in dev — LAN/localhost only.
  # ---------------------------------------------------------------------------
  livekit:
    # v1.9+ required: livekit-client 2.2x dials the /rtc/v1 signal path; on v1.8 it
    # falls back to a legacy path and publisher negotiation times out ("negotiation
    # timed out" on every client, connect/drop loop every ~15s).
    image: livekit/livekit-server:v1.9
    container_name: fapoms-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml --bind 0.0.0.0
    # Everything variable about this service comes from .env.docker. livekit.yaml keeps only the
    # settings that never change per machine (ports, ICE ranges, log level).
    #
    #   LIVEKIT_KEYS        the API keypair — the same two values the backend signs tokens with.
    #                       livekit.yaml deliberately has no `keys:` block: the credential lived in
    #                       two files that had to be edited together, and that YAML is committed,
    #                       so the secret was published with it.
    #   NODE_IP / TURN_DOMAIN  the host's LAN address, advertised to phones as the media candidate.
    #                       This was written into livekit.yaml twice, and a third time as the mobile
    #                       packager host below — three copies of one DHCP address that had already
    #                       drifted to three DIFFERENT values. One key now, LAN_HOST_IP.
    #
    # All four names are livekit-server's own env bindings (`livekit-server help-verbose`).
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
      NODE_IP: ${LAN_HOST_IP:-127.0.0.1}
      LIVEKIT_TURN_DOMAIN: ${LAN_HOST_IP:-127.0.0.1}
    ports:
      # 7880 (signaling ws/http) is deliberately NOT published: clients reach signaling
      # only through the backend's /livekit proxy. Media below is WebRTC (encrypted SRTP)
      # and must stay direct — it cannot ride an HTTP proxy.
      - "7881:7881"                       # ICE over TCP fallback
      - "50100-50200:50100-50200/udp"     # WebRTC media
      - "3478:3478/udp"                   # embedded TURN relay (LAN devices' media path)
    volumes:
      - ./infrastructure/livekit/livekit.yaml:/etc/livekit.yaml:ro

  # ---------------------------------------------------------------------------
  # Backend (NestJS) — Hot Reload via nest start --watch
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile.dev
    container_name: fapoms-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    volumes:
      # Bind-mount source code for hot reload
      - ./packages/backend/src:/app/packages/backend/src
      - ./packages/backend/nest-cli.json:/app/packages/backend/nest-cli.json
      - ./packages/backend/tsconfig.json:/app/packages/backend/tsconfig.json
      # The dependency manifest, so the container resolves the same package set as the host.
      # Without it, any `npm install` inside the container prunes packages added on the host
      # (helmet, throttler) because the container's copy of this file predates them.
      - ./packages/backend/package.json:/app/packages/backend/package.json
      # Operational scripts (password rotation, backfills) run inside the container so they
      # use the same network and credentials as the app.
      - ./packages/backend/scripts:/app/packages/backend/scripts
      # Bind-mount shared source & compiled dist
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/shared/dist:/app/packages/shared/dist
      # Firebase service account (for FCM push notifications)
      - ./fapoms-gss-firebase-adminsdk-fbsvc-848e0d4888.json:/app/packages/backend/fapoms-gss-firebase-adminsdk-fbsvc-848e0d4888.json
      # NOTE: No uploads bind-mount — all files are stored in MinIO (fapoms-minio)
      # Anonymous volume: keep container's node_modules (don't clobber with host)
      - /app/node_modules
      - /app/packages/backend/node_modules
      - /app/packages/shared/node_modules
      # On-demand pg_dump snapshots from the data-reset "danger zone" feature — named, so they
      # survive a container recreate the same way pgdata does.
      - backupsdata:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend (Vite + React) — Hot Reload via Vite HMR
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile.dev
    container_name: fapoms-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:3000
    volumes:
      # Bind-mount source code for hot reload
      - ./packages/frontend/src:/app/packages/frontend/src
      # Static assets (logo, favicon). Without this the container keeps whatever
      # public/ was baked into the image at build time, so any new or replaced
      # asset 404s — and Vite's SPA fallback answers with index.html and HTTP 200,
      # which makes the failure look like a success in curl.
      - ./packages/frontend/public:/app/packages/frontend/public
      - ./packages/frontend/index.html:/app/packages/frontend/index.html
      - ./packages/frontend/vite.config.ts:/app/packages/frontend/vite.config.ts
      - ./packages/frontend/tsconfig.json:/app/packages/frontend/tsconfig.json
      # Bind-mount shared source & compiled dist
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/shared/dist:/app/packages/shared/dist
      # Anonymous volume: keep container's node_modules
      - /app/node_modules
      - /app/packages/frontend/node_modules
      - /app/packages/shared/node_modules
    depends_on:
      - backend

  # ---------------------------------------------------------------------------
  # Mobile (Expo Web) — Hot Reload via Metro Bundler
  # ---------------------------------------------------------------------------
  mobile:
    build:
      context: .
      dockerfile: packages/mobile/Dockerfile.dev
    container_name: fapoms-mobile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      # LAN_HOST_IP from .env.docker — the same address LiveKit advertises. The fallback chain
      # keeps an explicitly-set REACT_NATIVE_PACKAGER_HOSTNAME winning, then LAN_HOST_IP; the
      # literal that used to sit here was a stale DHCP address that disagreed with livekit.yaml's.
      - REACT_NATIVE_PACKAGER_HOSTNAME=${REACT_NATIVE_PACKAGER_HOSTNAME:-${LAN_HOST_IP:-127.0.0.1}}
      - EXPO_PUBLIC_API_URL=http://${REACT_NATIVE_PACKAGER_HOSTNAME:-${LAN_HOST_IP:-127.0.0.1}}:3000/api/v1
      # Development only: a simulated device position as "lat,lng", for emulators that cannot
      # be given a real fix. Stripped from release bundles by the __DEV__ guard in
      # LocationContext; unset means no simulation.
      - EXPO_PUBLIC_DEV_LOCATION=${EXPO_PUBLIC_DEV_LOCATION:-}
    env_file:
      - .env.docker
    volumes:
      # Mount the whole package rather than an allow-list of individual files.
      #
      # Single-file bind mounts pin an inode. Editors and tools that save atomically
      # (write a temp file, then rename over the target) replace that inode, so the file
      # disappears *inside the container* while still looking fine on the host — the
      # container then fails with "Cannot resolve entry file" until it is recreated.
      # A directory mount survives atomic writes and picks up newly added files.
      - ./packages/mobile:/app/packages/mobile
      # Bind-mount shared source & compiled dist
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/shared/dist:/app/packages/shared/dist
      # Anonymous volumes: keep the container's own installs and build output so the
      # host's copies never shadow them.
      - /app/node_modules
      - /app/packages/mobile/node_modules
      - /app/packages/mobile/android
      - /app/packages/mobile/.expo
      - /app/packages/shared/node_modules
    depends_on:
      - backend

# =============================================================================
# Named Volumes
# =============================================================================
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local
  backupsdata:
    driver: local
