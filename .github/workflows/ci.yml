# Runs the tests that already exist.
#
# There were 1058 of them and nothing executed them on push. Meanwhile `auto-deploy` polls main
# every two minutes and ships it to the server real assayers are using, so a broken commit reached
# the field before anyone knew it was broken. Tests that only run when someone remembers to run
# them are a record of past intentions, not a safety net.
#
# The deploy gate lives in `deploy/auto-deploy.sh`, which refuses to deploy a commit this workflow
# has not marked green. That is the half that makes this more than a status badge.
name: CI

# `test` is here because it is where the work happens now. It used to be main-only, and the
# consequence was not theoretical: development moved to `test` and every commit from that point
# got zero typecheck, zero tests and zero build verification — the safety net was still hanging,
# just no longer under anybody.
#
# Only `main` gates a deploy. Running here buys the verdict early, on the branch where a mistake is
# still cheap to fix, instead of discovering it in the pull request that ships it.
on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

# A newer push makes an in-flight run pointless — except on main, where every commit needs its own
# verdict because the deploy gate reads the result per commit. `test` may cancel freely: nothing
# reads its result per commit, so only the latest answer matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the lockfile pins and fails if
      # the lockfile and package.json disagree, which is a real failure mode in a four-package
      # workspace where hoisting can otherwise mask an undeclared dependency.
      - name: Install
        run: npm ci

      # Shared is built first because both the backend and the frontend import from it, and a
      # stale dist would let a breaking change in shared pass unnoticed.
      - name: Build shared
        run: npm run build:shared

      # Types catch a class of breakage tests never reach — a renamed field, a changed signature,
      # a null that is now possible. Mobile is typechecked here and nowhere else: it has no build
      # step in CI because it ships through EAS, so this is its only structural check.
      - name: Typecheck
        run: |
          npx tsc --noEmit -p packages/backend/tsconfig.json
          npx tsc --noEmit -p packages/frontend/tsconfig.json
          npx tsc --noEmit -p packages/mobile/tsconfig.json

      # Lint runs at error level only. `eslint.config.mjs` deliberately files stylistic and
      # opinionated rules as warnings, and there are ~298 of them; failing on those would mean
      # either a red board on day one or a mass rewrite nobody reviewed. Errors are a different
      # class — a real fallthrough, an unreachable branch, an invisible character in source — and
      # the eight that existed when this step was added are fixed, so the gate starts green and
      # any new error is genuinely new.
      - name: Lint
        run: npm run lint

      # Unit suites only. The two PostgreSQL concurrency suites are named `*.db.spec.ts` and are
      # held out by jest's `testPathIgnorePatterns`, because they do not stub a database -- they
      # open a real connection through `AppDataSource` and DELETE rows from live tables. This job
      # has no `services:` block and no migrated schema, so they can only ever fail here; they
      # arrived already failing in 942b20e4, masked by a lint failure ahead of them.
      #
      # The `.db.spec.ts` suffix is deliberate. Nine guard specs in this repo scan the tree with
      # `endsWith('.spec.ts')` to exempt test files, so a suffix like `.db-spec.ts` would quietly
      # enrol these two as production source in every one of them -- derived-status.spec.ts caught
      # exactly that. Keeping `.spec.ts` at the end means the exclusion lives in one place.
      #
      # They are not abandoned: `npm run test:db -w @fapoms/backend` runs them against a real
      # migrated Postgres, where all 20 pass. Giving CI its own database is the real fix, and that
      # needs migrations plus fixtures, not just a `services:` block.
      - name: Test
        run: npm test --workspaces --if-present

      # The images are built from these two commands on the server. A build that only breaks
      # inside the Docker build breaks at deploy time, on the host, with the old container already
      # torn down — so it gets caught here instead.
      - name: Build backend
        run: npm run build:backend

      - name: Build frontend
        run: npm run build:frontend

  # ───────────────────────────────────────────────────────────────────────────────────────────
  # The half `verify` cannot do, because it has no database.
  #
  # `verify`'s own comment says so: the `.db.spec.ts` suites open a real connection through
  # `AppDataSource`, so they can only ever fail in a job with no `services:` block, and "giving CI
  # its own database is the real fix". This is that job.
  #
  # What it proves that nothing else can:
  #
  #  - the migrations still build a schema from NOTHING. Every deployment migrates a database that
  #    already has most of the schema, so the only thing routinely exercised is the newest
  #    migration on top of the previous one. A migration that depends on something a later one
  #    renamed works forever on the deployed database and fails the first time anybody provisions.
  #  - the runtime database role cannot defeat the audit trail. Every attack is issued for real —
  #    DROP TRIGGER, DISABLE TRIGGER, TRUNCATE, ALTER FUNCTION — as the least-privileged role, on a
  #    database this job creates and drops. Reading the GRANT statements proves nothing; PostgreSQL
  #    refusing the statement does.
  #  - the six self-contained `.db.spec.ts` suites, including the finance-overview reconciliation.
  #
  # The two remaining `.db.spec.ts` files are NOT run here and must not be: they drive a live
  # deployment and sign in as long-lived certification accounts whose password is deliberately not
  # in this repository. They are deployment certification, not integration tests.
  #
  # `postgis/postgis:16-3.4` rather than plain `postgres`, because the schema uses PostGIS columns
  # and geography functions; a plain image fails the very first migration.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          # The superuser this job bootstraps FROM. The application never uses it: the whole point
          # of the run below is that the API connects as a role created by that bootstrap.
          POSTGRES_USER: pgadmin
          POSTGRES_PASSWORD: pgadmin_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgadmin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_ADMIN_URL: postgres://pgadmin:pgadmin_ci@127.0.0.1:5432/postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_SSL: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # The backend imports from it, and the db suites import the backend.
      - name: Build shared
        run: npm run build:shared

      # From `template0`, then again to prove the second run is a no-op, then the real seed — a
      # fresh install is migrate THEN seed, and the seed used to remove nineteen of the grants the
      # migrations had just installed. Drops its own database on every exit path, so a failure here
      # leaves nothing behind for the next run to trip over.
      - name: A fresh install comes up migrated, idempotent and fully granted
        run: npm run verify:migrations

      # Provisions roles and a database, migrates as the non-superuser deploy role, hardens, and
      # then attempts every audit-bypass and escalation attack as the runtime role — checking as
      # well that ordinary application work still succeeds, because a boundary that breaks the
      # product is one somebody switches off.
      - name: The runtime database role cannot defeat the audit trail
        run: npm run verify:runtime-role

      # The suites that build their own fixtures. `--testPathIgnorePatterns` with no value clears
      # the pattern that holds `.db.spec.ts` out of the unit run; the regex then names exactly the
      # six that do not need a live deployment.
      - name: Self-contained database suites
        env:
          DB_NAME: fapoms_ci
        run: node scripts/create-database.mjs

      # `--testPathIgnorePatterns` with no value clears the pattern that holds `.db.spec.ts` out of
      # the unit run; the regex then names exactly the six suites that build their own fixtures and
      # need no live deployment.
      - name: Run them
        working-directory: packages/backend
        env:
          DB_USERNAME: pgadmin
          DB_PASSWORD: pgadmin_ci
          DB_DATABASE: fapoms_ci
        run: |
          npm run migration:run
          npx jest --ci -w 1 --testPathIgnorePatterns --testRegex '(assignment-postgres-concurrency|assignment-reassignment-lineage|billing-overview-region-scope|payout-destination-evidence|notification-tenant-isolation|assayer-postgres-concurrency)\.db\.spec\.ts$'
