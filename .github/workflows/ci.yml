# Runs the tests that already exist.
#
# There were 1058 of them and nothing executed them on push. Meanwhile `auto-deploy` polls main
# every two minutes and ships it to the server real assayers are using, so a broken commit reached
# the field before anyone knew it was broken. Tests that only run when someone remembers to run
# them are a record of past intentions, not a safety net.
#
# The deploy gate lives in `deploy/auto-deploy.sh`, which refuses to deploy a commit this workflow
# has not marked green. That is the half that makes this more than a status badge.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push makes an in-flight run pointless — except on main, where every commit needs its own
# verdict because the deploy gate reads the result per commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the lockfile pins and fails if
      # the lockfile and package.json disagree, which is a real failure mode in a four-package
      # workspace where hoisting can otherwise mask an undeclared dependency.
      - name: Install
        run: npm ci

      # Shared is built first because both the backend and the frontend import from it, and a
      # stale dist would let a breaking change in shared pass unnoticed.
      - name: Build shared
        run: npm run build:shared

      # Types catch a class of breakage tests never reach — a renamed field, a changed signature,
      # a null that is now possible. Mobile is typechecked here and nowhere else: it has no build
      # step in CI because it ships through EAS, so this is its only structural check.
      - name: Typecheck
        run: |
          npx tsc --noEmit -p packages/backend/tsconfig.json
          npx tsc --noEmit -p packages/frontend/tsconfig.json
          npx tsc --noEmit -p packages/mobile/tsconfig.json

      - name: Test
        run: npm test --workspaces --if-present

      # The images are built from these two commands on the server. A build that only breaks
      # inside the Docker build breaks at deploy time, on the host, with the old container already
      # torn down — so it gets caught here instead.
      - name: Build backend
        run: npm run build:backend

      - name: Build frontend
        run: npm run build:frontend

  # ---------------------------------------------------------------------------------------------
  # Ship mobile JS changes over the air, automatically, the moment `verify` is green.
  #
  # The backend and web app already deploy themselves on push (auto-deploy.sh, gated on this
  # workflow's verdict). The mobile app did not: every fix that only touched JS still needed a
  # person to remember to run `eas update` by hand — and most mobile fixes ARE JS-only. This job
  # closes that gap so a mobile fix is commit → push → on every phone in about two minutes, with
  # no APK build and no reinstall.
  #
  # Two things it will NOT do, on purpose:
  #  - Run when nothing under packages/mobile or packages/shared changed. An OTA publish for a
  #    backend-only commit is a no-op that still costs a minute and adds noise to the update list
  #    support reads from.
  #  - Ship a NATIVE change over the air. This is the one that can hurt people, so it is worth
  #    being precise about: this app's `runtimeVersion` is a fixed literal ("1.0.0"), NOT a
  #    fingerprint of the native code, so EAS will NOT notice that a commit added a native module.
  #    If this job published anyway, every phone on the old APK would download JS that calls into
  #    native code it does not have and crash on launch — with no way back, in the field. So the
  #    guard has to live here. Native code only ever changes in a small, known set of paths; if
  #    any of them moved, this job refuses, says exactly which file, and points at the APK path.
  #    Those commits ship as a real build (BUILD-APK.md, deploy/publish-apk.sh) — the same
  #    ~15-minute path used today, which is genuinely the only correct one for that case.
  # ---------------------------------------------------------------------------------------------
  ota-update:
    needs: verify
    # Only main, only pushes (a PR must not publish to real phones), only when mobile could differ.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the parent commit to ask "did anything mobile-relevant change in this push".
          fetch-depth: 2

      - name: Did mobile change, and is it OTA-safe?
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          if ! echo "$CHANGED" | grep -qE '^packages/(mobile|shared)/'; then
            echo "mobile=false" >> "$GITHUB_OUTPUT"
            echo "No packages/mobile or packages/shared change in this push — skipping OTA."
            exit 0
          fi
          # Anything native. `package.json` is here because adding a dependency is how a native
          # module arrives — expo-application in b67c553e is the live example: JS-visible, but it
          # only works because it was compiled into build 5. Publishing that commit's JS over the
          # air to build-4 phones would have crashed them.
          NATIVE=$(echo "$CHANGED" | grep -E \
            '^packages/mobile/(android/|ios/|modules/|app\.config\.js$|app\.json$|eas\.json$|package\.json$|google-services\.json$)' || true)
          if [ -n "$NATIVE" ]; then
            echo "mobile=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=OTA skipped — native change::This push touches native/build files, so it cannot be shipped over the air and needs a new APK build (see packages/mobile/BUILD-APK.md and deploy/publish-apk.sh). Files:"
            echo "$NATIVE" | sed 's/^/  /'
            exit 0
          fi
          echo "mobile=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.mobile == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install
        if: steps.changed.outputs.mobile == 'true'
        run: npm ci

      # Metro bundles @fapoms/shared from its compiled dist, exactly as the EAS build worker does.
      - name: Build shared
        if: steps.changed.outputs.mobile == 'true'
        run: npm run build:shared

      # The token is an Expo access token created at expo.dev → Account settings → Access tokens
      # and stored as the EXPO_TOKEN repository secret. It lets this job publish as the account
      # that owns @deepstacker/fapoms-mobile. Nothing else in the repo needs it.
      - name: Publish OTA update to production
        if: steps.changed.outputs.mobile == 'true'
        working-directory: packages/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set — cannot publish OTA. Add it under repo Settings → Secrets."
            exit 1
          fi
          # The commit subject becomes the update message, so `eas update:list` and the version
          # line on a handset (first 7 chars of the id) both trace straight back to a commit.
          npx eas update --branch production --auto --non-interactive \
            --message "$(git log -1 --pretty=%s) (${GITHUB_SHA::7})"
