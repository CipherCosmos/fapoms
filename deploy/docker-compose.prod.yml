# Production stack. Runs under rootless Podman on this host.
#
# Differs from the repo's docker-compose.yml deliberately: that one is the development stack —
# Dockerfile.dev, bind-mounted source, hot reload, and LiveKit's wide UDP media range, which
# rootless networking cannot map. This builds the production images and publishes exactly one
# port, to localhost, for Tailscale Funnel to reach.
#
#   Internet → Tailscale Funnel :443 → 127.0.0.1:8080 → caddy → frontend / backend

# Resource limits, health checks and stop grace periods were added on 2026-08-16. Sized for
# the current host (4 vCPU / 11.5 GB) with headroom for the image builds auto-deploy runs on
# this same machine; raise `mem_limit`s together if the host grows. A container that exceeds
# its limit is OOM-killed and restarted rather than taking Postgres down with it.
#
# Memory only, no `cpus:`. Rootless podman can only enforce the cgroup controllers systemd
# delegates to the user session, and on this host that is `memory pids` (checked with
# `podman info --format '{{.Host.CgroupControllers}}'`) — a `cpus:` line would make
# `compose up` fail outright. To add CPU limits later, delegate the controller (needs root):
#   /etc/systemd/system/user@.service.d/delegate.conf → [Service] Delegate=cpu cpuset io memory pids
#   systemctl daemon-reload, then log out and in; re-check `podman info` before adding `cpus:`.
#
# NOTE: neither podman nor docker restarts a container merely for failing its healthcheck —
# only for exiting. The healthchecks feed `podman ps` / `depends_on` and the deploy script's
# wait; a hung-but-alive API still needs the process to exit (it does on unhandled errors).

services:
  postgres:
    # PostGIS, not stock Postgres: three columns are geometry and the planning engines are built
    # on ST_* distance queries.
    image: docker.io/postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ─────────────────────────────────────────────────────────────────────────────────────────
    # Tuning. Until 2026-08-17 this ran entirely on image defaults — shared_buffers 128 MB,
    # work_mem 4 MB, random_page_cost 4 (a spinning disk), JIT on, no pg_stat_statements and
    # no slow-query log. Verified with `SHOW`, not assumed.
    #
    # Every value is sized to `mem_limit` below (3 GB), NOT to the host's 11.5 GB. The host also
    # runs the API, Redis, MinIO and the auto-deploy image builds; a Postgres tuned for the
    # machine would be OOM-killed the first time a build ran.
    #
    # Passed as `-c` flags rather than a mounted postgresql.conf so the whole configuration is
    # in this file next to the limit it is sized against, and so there is no second file to keep
    # in sync. Defaults are in .env.production.example; each knob is documented there.
    # ─────────────────────────────────────────────────────────────────────────────────────────
    command:
      - postgres
      # 25% of the container limit — the standard starting point, and with a working set this
      # small (the whole schema is ~15 MB today) it means the hot tables live in memory rather
      # than being re-read through the OS. 128 MB was the image default, not a decision.
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-768MB}
      # A planner hint, not an allocation: "how much cache is there in total?". Deliberately
      # LOWER than the 4 GB default, because the OS page cache backing this container's reads is
      # charged to the same 3 GB cgroup — claiming 4 GB tells the planner about memory that
      # cannot exist here.
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}
      # Per sort/hash node, per query — so the real ceiling is this × nodes × concurrency, which
      # is why it is 16 MB and not 64. At 4 MB the dashboard's GROUP BY over 200k assignments and
      # every ORDER BY in the reports spilled to a temp file on disk.
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      # For VACUUM and CREATE INDEX. Raised because as of this release Postgres finally has dead
      # tuples to collect (see `infrastructure/retention`); at 64 MB a vacuum of the location
      # trail needs several index passes instead of one.
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      # Capped separately so three autovacuum workers cannot claim 3 × maintenance_work_mem
      # between them and push the container into its limit.
      - -c
      - autovacuum_work_mem=${PG_AUTOVACUUM_WORK_MEM:-128MB}
      # SSD. The default of 4 encodes a seek on spinning rust and made the planner prefer
      # sequential scans over exactly the indexes 1790300000000 and 1790600000000 restored.
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-200}
      # OFF. Measured 2026-08-17 on a 3M-row PostGIS ST_DWithin count: 1,550 ms of JIT
      # (generation, inlining, optimisation, emission) inside a 1,870 ms query; the same query
      # with jit=off ran in 1,046 ms. LLVM compiles the expression tree on every query whose
      # *estimated* cost clears jit_above_cost, and PostGIS function costs clear it constantly.
      # This is the single biggest wall-clock win in this block.
      - -c
      - jit=${PG_JIT:-off}
      # Autovacuum, retuned because retention changes what it has to do. Deleting ~50k rows an
      # hour from tables projected into the tens of millions never reaches the default 20%
      # dead-tuple threshold in any useful time, so the space would be marked reusable and never
      # actually reclaimed — retention that does not shrink anything. The cost limit is the other
      # half: at the default 200 a worker sleeps most of its life and cannot keep up with the
      # purge that is feeding it.
      - -c
      - autovacuum_vacuum_scale_factor=${PG_AUTOVACUUM_SCALE_FACTOR:-0.05}
      - -c
      - autovacuum_vacuum_cost_limit=${PG_AUTOVACUUM_COST_LIMIT:-1000}
      # Batched deletes plus full-page writes after a checkpoint make retention the WAL-heaviest
      # thing this database does. A larger max_wal_size trades pg_wal disk for fewer checkpoints
      # (each of which re-writes every touched page in full); pglz compression trades a little
      # CPU for materially less of that WAL reaching the disk.
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-2GB}
      - -c
      - min_wal_size=${PG_MIN_WAL_SIZE:-512MB}
      - -c
      - wal_compression=${PG_WAL_COMPRESSION:-on}
      # Observability. The audit of 2026-08-16 could not answer "which query is slow in
      # production?" from the database at all — there was no statement history and no slow log,
      # so every measurement had to be reproduced by hand against a scratch copy.
      #
      # Preloading the library is necessary but not sufficient — the extension must also exist in
      # the application database. That half is now done by migration
      # 1790700000000-EnableQueryStatistics, so there is no manual step and no deployment that
      # can be preloaded-but-empty. This block previously told the operator to run
      # `CREATE EXTENSION` by hand and justified it with "CREATE EXTENSION errors outright when
      # the library is not preloaded". That was checked on 2026-08-17 against PG 16.4 and is
      # simply not true: CREATE EXTENSION succeeds with no library loaded (it only installs the
      # SQL objects); what fails, with SQLSTATE 55000 "must be loaded via
      # shared_preload_libraries", is SELECTing from the view afterwards. So a migration is safe
      # in either order, and the ordering hazard lives entirely on the reader — which is why
      # RuntimeMetricsService treats 55000 as "not available yet" rather than an error.
      #
      # RESTART REQUIRED for the line below: shared_preload_libraries is PGC_POSTMASTER. Neither
      # `pg_reload_conf()` nor `ALTER SYSTEM` can bring it into effect — the container has to be
      # recreated, and until it is, the extension exists but collects nothing.
      - -c
      - shared_preload_libraries=${PG_PRELOAD_LIBRARIES:-pg_stat_statements}
      - -c
      - pg_stat_statements.max=${PG_STAT_STATEMENTS_MAX:-5000}
      - -c
      - pg_stat_statements.track=${PG_STAT_STATEMENTS_TRACK:-top}
      # Anything over a second, with its parameters. Chosen to be quiet on a healthy system —
      # the point is a log that gets read, not one that gets rotated away. Logs are capped at
      # 20 MB × 5 by the `logging:` block below.
      - -c
      - log_min_duration_statement=${PG_LOG_MIN_DURATION_MS:-1000}
      - -c
      - log_autovacuum_min_duration=${PG_LOG_AUTOVACUUM_MIN_DURATION_MS:-10000}
      # Real I/O timings in EXPLAIN (BUFFERS) and pg_stat_statements, instead of buffer counts
      # alone. Cheap on any host with a working TSC clocksource; check with `pg_test_timing` if
      # this box is ever virtualised onto something slower.
      - -c
      - track_io_timing=${PG_TRACK_IO_TIMING:-on}
    # Postgres uses shared memory for parallel query and hash joins; the container default
    # (64 MB) makes larger plans fail with "could not resize shared memory segment".
    shm_size: 512m
    mem_limit: ${PG_MEM_LIMIT:-3g}
    # Enough for a checkpoint to complete; killing Postgres mid-checkpoint just makes the
    # next start replay WAL.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    # maxmemory with noeviction: Redis holds queues and rate-limit counters as well as caches,
    # and silently evicting a Bull job would lose work; better to refuse writes loudly (the
    # cache and limiter fail open on that) than to grow until the host swaps. Bull's failed-job
    # retention is what fills this — see the notification and OCR queue options.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-384mb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  minio:
    # Pinned to the release that is running today. `:latest` meant every `pull` could change
    # the object store under the audit evidence; MinIO has removed features between releases.
    # Bump deliberately, after reading the release notes.
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    mem_limit: ${MINIO_MEM_LIMIT:-1g}
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 30
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    build:
      context: ..
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    env_file: [../.env.docker]
    environment:
      # Cap the V8 heap below the container limit so Node degrades (GC pressure, then a clean
      # heap-out-of-memory exit that restart policy recovers) instead of being SIGKILLed by
      # the cgroup with no log line. Keep ~500 MB between the two for buffers, sockets, TLS
      # and the file uploads that pass through this process.
      NODE_OPTIONS: ${BACKEND_NODE_OPTIONS:---max-old-space-size=1024}
    mem_limit: ${BACKEND_MEM_LIMIT:-1536m}
    # A deploy or restart used to get podman's default 10 s before SIGKILL, against a
    # request timeout of 300 s: field uploads, Excel imports and OCR jobs in flight were cut
    # every time. The app closes its pools, queues and sockets on SIGTERM; give it time to.
    stop_grace_period: 60s
    healthcheck:
      # Liveness only: the process is up and can reach its database. Deliberately not the
      # readiness probe (which includes Redis) — Redis being away must not make the API
      # look dead to the deploy script.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  frontend:
    build:
      context: ..
      dockerfile: packages/frontend/Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    # Loopback ONLY. Tailscale Funnel proxies from the public edge to localhost, so this is all
    # it needs — and binding nothing else means there is exactly one way in, over TLS, with one
    # place to reason about who can reach the app.
    #
    # It briefly also bound the host's Tailscale address, which made the app reachable as plain
    # HTTP on 100.x.x.x:8080. That is a second door with different (weaker) properties than the
    # front one, and a second URL that anything pointed at it would silently depend on.
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddydata:/data
      # APKs to hand out. A host directory rather than a volume, so publishing a new build is
      # `scp` into it — no container rebuild, no compose restart.
      - ${APK_DIR:-/srv/fapoms-downloads}:/srv/fapoms-downloads:ro,z
    depends_on: [backend, frontend]

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
