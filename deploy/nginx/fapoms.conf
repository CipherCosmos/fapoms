# FAPOMS — host nginx in front of the production stack
#
#   Internet → nginx :443 (TLS) → 127.0.0.1:8080 → caddy → backend:3000 / frontend static
#
# Everything below :8080 is deploy/docker-compose.prod.yml's business: Caddy already splits
# /api, /socket.io and /livekit off to the API and serves the built frontend for everything
# else, on one origin. So this file proxies the whole site to one place and does not try to
# route anything itself — two routing tables describing one application is how they drift.
#
# Install:
#   sudo cp deploy/nginx/fapoms.conf /etc/nginx/sites-available/fapoms
#   sudo ln -sf /etc/nginx/sites-available/fapoms /etc/nginx/sites-enabled/fapoms
#   sudo nginx -t && sudo systemctl reload nginx
#
# The TLS block expects certificates from:
#   sudo certbot --nginx -d fapoms.goldauditpro.com -d www.fapoms.goldauditpro.com

# WebSockets need `Connection: upgrade`, ordinary requests need `Connection: close`. Sending
# 'upgrade' on every request (the usual copy-paste) breaks keepalive for normal traffic; this
# map sets the right value per request. Must live at http{} level — put it in nginx.conf or
# /etc/nginx/conf.d/, NOT inside a server block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name fapoms.goldauditpro.com www.fapoms.goldauditpro.com;

    # ACME first, and OUTSIDE the dotfile rule below.
    #
    # A `location ~ /\.` deny placed above this one also matches /.well-known/acme-challenge/…,
    # because that path is a slash followed by a dot. Certificates then stop renewing roughly
    # 60 days later, with nothing failing in the meantime to warn anyone. Order decides this:
    # nginx tries regex locations in the order they are written and takes the first match.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fapoms.goldauditpro.com www.fapoms.goldauditpro.com;

    ssl_certificate     /etc/letsencrypt/live/fapoms.goldauditpro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fapoms.goldauditpro.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads. The app accepts 50 MB documents (MAX_FILE_SIZE / DOCUMENT_MAX_UPLOAD_MB), and
    # nginx defaults to 1 MB — every branch document and KYC photo over that would be refused
    # with a 413 that never reaches the application logs. Keep this at or above the app's limit.
    client_max_body_size 64m;
    client_body_timeout 300s;

    # Field uploads run over mobile networks; a slow POST must not be cut off mid-transfer.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Same intent as the original config: never serve dotfiles. Scoped to the document root
    # rather than the whole URI space, so it cannot swallow application paths that legitimately
    # contain a dot segment. `deny` alone already answers 403; returning 404 hides existence.
    location ~ ^/\.(?!well-known) {
        deny all;
        return 404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Realtime: notifications, the feedback channel and LiveKit signalling all ride
        # WebSockets through this one location, since Caddy does the path routing behind it.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The API trusts this to decide the scheme it builds links with, and to rate-limit by
        # real client rather than by proxy. TRUST_PROXY must stay on in .env.docker for it to
        # be read at all.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }
}
