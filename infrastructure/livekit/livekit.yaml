# LiveKit dev configuration for FAPOMS voice calls.
#
# Keys here MUST match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env.docker — the backend
# signs room-scoped access tokens with them. Development values; rotate both for production
# and turn on use_external_ip / TLS there.
port: 7880
rtc:
  port_range_start: 50100
  port_range_end: 50200
  tcp_port: 7881
  # Dev runs on localhost/LAN; in production behind a public IP this must be true.
  use_external_ip: false
  # Advertise the HOST machine's LAN address as the media candidate. Without this,
  # LiveKit advertises its docker-internal IP, which phones on the Wi-Fi cannot route
  # to — signaling connects (proxied via the backend) but ICE "negotiation times out".
  # NOTE: this is the dev Mac's DHCP address — if the network reassigns it, update it
  # here (same drift issue as the APK's baked-in API host).
  node_ip: 10.135.43.233
keys:
  devkey: secret
# Embedded TURN relay. LiveKit-in-docker advertises its container IP in ICE candidates,
# which LAN phones cannot route to — direct UDP fails and calls die with "negotiation
# timed out". TURN gives clients one fixed, published UDP port (3478) to send media to;
# LiveKit relays it to the SFU internally. LAN devices fall back to it automatically.
turn:
  enabled: true
  udp_port: 3478
  # The hostname clients are told to send TURN traffic to — must be the HOST machine's
  # LAN address (same DHCP-drift caveat as rtc.node_ip above).
  domain: 10.135.43.233
logging:
  level: info
