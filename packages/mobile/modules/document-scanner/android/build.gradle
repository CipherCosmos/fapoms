apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.fapoms.documentscanner'
version = '1.0.0'

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle",
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()

android {
  namespace 'com.fapoms.documentscanner'
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    minSdk rootProject.ext.minSdkVersion
    targetSdk rootProject.ext.targetSdkVersion
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  // Google's on-device document scanner — the same ML Kit pipeline Google ships
  // in the Drive scanner. UI + model are delivered through Play Services, so this
  // adds no model weight to the APK.
  implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
}
