# Serving a single-page app: every route is index.html.
#
# Without this file the image used stock nginx, which serves files and 404s on anything else.
# The app only ever writes one real file — `/index.html` — and React Router does the rest in the
# browser. So the site worked exactly as long as nobody refreshed: land on `/`, click through to
# `/billing`, press F5, and nginx looks for a directory called `billing`, does not find one, and
# returns 404. Same for any link anyone pastes to a colleague, and any bookmark.
#
# `try_files ... /index.html` is the fix: serve the file if it exists, otherwise hand back the app
# and let the router read the URL.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed asset filenames change whenever content changes, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must NOT be cached, or a browser keeps loading an old bundle that points at
  # asset filenames the new deploy has already removed — a blank page that a redeploy cannot fix
  # and only a hard refresh clears.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Compresses the bundle on the wire. The JS is well over 500KB and this is most of the
  # first-load time on a field connection.
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
  gzip_min_length 1024;

  # Cheap, standard hardening for a static origin. The API sets its own headers via helmet.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # The API already emits HSTS (helmet); the HTML shell served here did not, leaving the very first
  # navigation without the "HTTPS only" instruction. Match the API so the whole origin is pinned to
  # TLS from the first byte. Safe because the app is only ever served over HTTPS (Funnel/Caddy).
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
