# Serving a single-page app: every route is index.html.
#
# Without this file the image used stock nginx, which serves files and 404s on anything else.
# The app only ever writes one real file — `/index.html` — and React Router does the rest in the
# browser. So the site worked exactly as long as nobody refreshed: land on `/`, click through to
# `/billing`, press F5, and nginx looks for a directory called `billing`, does not find one, and
# returns 404. Same for any link anyone pastes to a colleague, and any bookmark.
#
# `try_files ... /index.html` is the fix: serve the file if it exists, otherwise hand back the app
# and let the router read the URL.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Real, not decorative: every directive below is here because something this app actually
  # loads needs it, worked out from index.html, index.css and a grep of src/ for external hosts.
  #
  #  script-src: 'self' plus the exact hash of index.html's inline theme/FOUC-prevention script
  #    (computed from the built output, not the source file — Vite leaves it unminified, so the
  #    two match), plus 'unsafe-hashes' and the two literal print-window handler bodies
  #    (`window.print()` / `window.close()`, written via document.write() in assayerProfilePrint.ts
  #    and invoicePrint.ts — those popups are opened with window.open('', '_blank') and therefore
  #    inherit THIS document's CSP per the spec's "local scheme" inheritance rule, so their inline
  #    handlers are subject to this policy too, not exempt from it). No 'unsafe-inline': this is
  #    the one directive where CSP actually earns its keep against injected script.
  #  style-src: 'self' plus fonts.googleapis.com for the @import in index.css, plus unpkg.com for
  #    the Leaflet stylesheet `<link>` in index.html's <head>, plus 'unsafe-inline'
  #    — a deliberate, narrower concession than script-src. Two real sources need it and neither is
  #    hashable: the same print-window popups also write static `style="…"` attributes and <style>
  #    blocks via document.write(), and NotificationAdmin.tsx renders a live, server-composed email
  #    preview through an `<iframe srcDoc=…>`, which is also CSP-inherited and whose inline styling
  #    is inherently dynamic (arbitrary template HTML, different on every preview) and can never be
  #    pinned to a fixed hash. CSS cannot execute script, so this concession does not reopen the
  #    thing script-src exists to close.
  #  font-src: fonts.gstatic.com, where the Google Fonts stylesheet's @font-face rules actually
  #    point.
  #  img-src: 'self' plus blob: (every document/photo preview in the app fetches its bytes with an
  #    auth header via `api.request` and displays them as `URL.createObjectURL(blob)` — a plain
  #    <img src> can't carry that header) plus the two Leaflet tile hosts InteractivePlanningMap.tsx
  #    uses (OSM street tiles, Esri World Imagery satellite tiles — both picked specifically for
  #    being free/keyless, see the comment there), plus unpkg.com for the sprites leaflet.css itself
  #    references (layers.png etc. — the app's own markers are all L.divIcon, never Leaflet's
  #    default marker-icon.png, but the stylesheet is unpkg's and this is where its own rules point).
  #  connect-src: 'self' (the app calls its own API and socket.io only ever on relative paths —
  #    see api.ts and socket.ts — same-origin under this reverse-proxy topology) plus blob: (pdf.js
  #    in PdfRegionViewer.tsx fetches the blob: object URL it's handed) plus the two third-party
  #    APIs actually fetched from the browser: router.project-osrm.org (InteractivePlanningMap.tsx's
  #    live road-distance lookup) and api.postalpincode.in (AssayerForms.tsx's pincode lookup).
  #  worker-src: 'self' — pdfjs-dist's worker, bundled and served from this origin (see the
  #    `?url` import in PdfRegionViewer.tsx), never fetched from a CDN.
  #  object-src 'none', base-uri 'self', form-action 'self': nothing in this app uses <object>/
  #    <embed>, a <base> tag, or a plain HTML form post — grepped for all three, found none, so
  #    there is no legitimate use to carve an exception for.
  #  frame-src 'self': the only iframe in the app is NotificationAdmin.tsx's srcDoc email preview,
  #    which counts as same-origin for this purpose.
  #  frame-ancestors 'self': the CSP-native form of the X-Frame-Options below; kept alongside it
  #    for browsers that only honour one or the other.
  #
  # NOTE ON FRAGILITY: the script-src hashes are content-addressed. If the inline script in
  # index.html, or the two literal onclick bodies in assayerProfilePrint.ts / invoicePrint.ts,
  # ever change, the corresponding hash here goes stale — and because a CSP violation only ever
  # shows up in the browser console, never as a build or test failure (CSP config isn't
  # jest-testable), that break is silent until someone notices the theme flashing or a print
  # button doing nothing. Recompute with `openssl dgst -sha256 -binary | openssl base64`.
  set $csp "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-l+DuY5lZe2VJR+ts3dzXkDUy3Ek556C4bhHSv8cnGJo=' 'sha256-MguIPR6qNR8D3B+eAlK+bIRTZe8t3wkOY4B/56Me9FU=' 'sha256-jqxtvDkBbRAl9Hpqv68WdNOieepg8tJSYu1xIy7zT34='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: https://server.arcgisonline.com https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self' blob: https://router.project-osrm.org https://api.postalpincode.in; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self'; frame-ancestors 'self'";

  # Hashed asset filenames change whenever content changes, so they can be cached hard.
  #
  # This location (and `= /index.html` below) declares its own Cache-Control, and nginx's
  # add_header ONLY inherits from the parent context when the current context adds none of its
  # own — declaring even one add_header here means the server-level security headers further
  # down are silently dropped for every response this block serves unless repeated here too.
  # Confirmed with a real nginx:alpine container against this exact file: before this fix, `curl`
  # against `/`, `/index.html` and `/assets/*` showed Cache-Control and nothing else — no HSTS, no
  # X-Frame-Options, no X-Content-Type-Options, on any of them.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri =404;
  }

  # index.html must NOT be cached, or a browser keeps loading an old bundle that points at
  # asset filenames the new deploy has already removed — a blank page that a redeploy cannot fix
  # and only a hard refresh clears.
  #
  # This is the block that matters most for the headers below: `try_files`'s fallback to
  # `/index.html` in `location /` is an internal redirect, which nginx re-matches against every
  # location block — so `/`, `/billing`, any deep link, ALL end up served from here, never from
  # the bare `location /` below. Whatever this block does not repeat, no real page load gets.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp always;
  }

  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp always;
    try_files $uri $uri/ /index.html;
  }

  # Compresses the bundle on the wire. The JS is well over 500KB and this is most of the
  # first-load time on a field connection.
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
  gzip_min_length 1024;
}
